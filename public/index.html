<!DOCTYPE html>
<html>
    <head>
        <title>Intro to JavaScript DOM</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="a test for connecting backend" />

        <link rel="stylesheet" href="./css/styles.css" />

        <script type="module">
            import App from "./js/posts.js";

            const app = new App();
        </script>
    </head>
    <body>
        <!-- the .wrapper class creates empty space on both of left and the right of the page (see styles.css) -->
        <div class="wrapper">
            <header>
                <img class="navbar-icon" src="images/tree-icon.png" />
                <nav>
                    <ul class="nav-list">
                        <li><a href="index.html">Home</a></li>
                    </ul>
                </nav>
            </header>

            <!-- the .two-column class creates a two column grid (see styles.css) 
                  each of its children (the two <div> elements) is a column -->
            <main class="two-column">

                <!-- column 1 contains the form
                        the .justify-content-center class centers the form within this div (see styles.css) -->
                <div class="justify-content-center">
                    
                    <!-- Notice that this form is disabled when the page initially loads.
                            This form gets enabled at the end of the App.loadPosts method in posts.js -->
                    <form id="add-post" disabled>
                        <label class="form-label" for="post-body">Write a post</label>
                        <input class="form-text" id="post-body" type="text" />

                        <button class="form-button">Submit Post</button>
                    </form>
                </div>

                <!-- column 2 contains the sort button and the post container -->
                <div>
                    <button class="form-button" id="sort">Sort Posts</button>
                    <div class="post-container" id="post-container"></div>
                </div>

            </main>
        </div> <!-- end .wrapper <div> -->
    </body>
</html>
